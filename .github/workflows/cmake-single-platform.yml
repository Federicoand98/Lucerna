name: Build release

# Solo alla pubblicazione di un tag di versione, piu' l'avvio manuale dalla tab Actions.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true   # GLFW si compila dal submodule deps/glfw, con la patch di tools/glfw

    - name: Install dependencies
      run: >
        sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc
        libwayland-dev wayland-protocols libxkbcommon-dev
        libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure CMake
      run: cmake -S ${{github.workspace}}/PathTracing -B ${{github.workspace}}/PathTracing/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/PathTracing/build --config ${{env.BUILD_TYPE}}
